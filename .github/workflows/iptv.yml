name: IPTV Live Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Download Latest Playlist
        run: |
          mkdir -p output

          curl -L --silent \
          -A "Dalvik/2.1.0" \
          "https://pk79.io.vn/tv/" \
          -o output/playlist.m3u

      - name: Check Changes
        id: changes
        run: |
          git diff --quiet output/playlist.m3u && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit Update
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add output/playlist.m3u
          git commit -m "Auto update IPTV playlist"

      - name: Push Update
        if: steps.changes.outputs.changed == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
